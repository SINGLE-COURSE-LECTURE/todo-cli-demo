name: docs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: 문서 검사
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 도구 설치
        run: pip install -r requirements.txt

      - name: 검사 실행
        run: bash check.sh
